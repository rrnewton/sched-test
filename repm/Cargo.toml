[package]
name = "repm"
version = "0.1.0"
edition = "2021"
description = "ReproMagic — capture and reproduce scheduling behavior"

[[bin]]
name = "repm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

[profile.dev]
# Use Cranelift for fast dev builds (requires nightly + -Zcodegen-backend)
# For stable toolchain, this section is ignored gracefully.
