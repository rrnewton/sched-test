[package]
name = "rt-app-rs"
version = "0.1.0"
edition = "2021"
description = "Cgroup-aware workload specification and runtime: parse JSON specs with cgroup hierarchies, create cgroupfs trees, and place threads"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30", features = ["process", "sched", "user"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
