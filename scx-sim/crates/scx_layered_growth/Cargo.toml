[package]
name = "scx_layered_growth"
version = "0.1.0"
# 2024, NOT 2021 — see the matching note in crates/scx_layered_alloc/Cargo.toml.
# src/lib.rs #[path]-includes upstream
# scx/scheds/rust/scx_layered/src/layer_core_growth.rs, which is edition-2024
# source and now uses let chains.
edition = "2024"
# Measured, not guessed: 1.87.0 fails on the let chains in the upstream file this
# crate compiles (stable from 1.88); 1.88.0 builds the whole publish set and
# reproduces the 1.97.1 run fingerprints. Nothing re-checks it yet: sim-ojycs.
rust-version = "1.88"
description = "scx_layered's layer_core_growth.rs core-ordering policy, compiled verbatim against a simulator topology for scx_simulator"
# BSD-3-Clause: the adapter (src/). GPL-2.0-only: the upstream scx_layered
# policy file it compiles (vendor/scx). Both licence texts ship in the package.
license = "BSD-3-Clause AND GPL-2.0-only"
repository = "https://github.com/rrnewton/sched-test"
keywords = ["sched_ext", "scheduler", "simulator"]
categories = ["simulation"]
# `vendor/scx` is a symlink tree into the scx submodule in a checkout; cargo
# packages the target file itself.
include = [
    "/build.rs",
    "/src/**",
    "/vendor/scx/scheds/rust/scx_layered/src/layer_core_growth.rs",
    "/vendor/scx/LICENSE",
    "/LICENSE",
]

[lib]
# The 43 #[test]s inside the included upstream layer_core_growth.rs do NOT run,
# and structurally cannot here. This crate supplies the module's dependencies
# by shimming the whole scx_utils namespace (`extern crate self as scx_utils`
# in lib.rs), so upstream's tests — which want the real scx_utils::testutils,
# the real CpuPool::new, serde_json, and the full production LayerSpec serde
# schema — do not compile against it. Enabling this yields ~20 hard errors,
# not failures.
#
# Note the asymmetry with alloc.rs, which scx_layered_alloc compiles against its
# real dependencies and whose 80 upstream tests DO run in our suite: that is a
# materially stronger guarantee than this module has. What backs
# layer_core_growth.rs instead is differential behaviour testing from
# scx_simulator's integration tests — `upstream_linear_and_reverse_choose_
# different_freed_cores` distinguishes two real algorithms on a simulated
# topology, and a sabotage that collapses per-layer core ordering fails it.
test = false
doctest = false

[build-dependencies]
scxsim-build = { version = "0.1.0", path = "../scxsim-build" }

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
