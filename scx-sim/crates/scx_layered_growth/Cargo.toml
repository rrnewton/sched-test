[package]
name = "scx_layered_growth"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# The included upstream module's own tests depend on scx_utils::testutils and
# the complete production LayerSpec serde schema. The policy itself is tested
# through scx_simulator's integration tests against simulated topologies.
test = false
doctest = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2"
serde = { version = "1", features = ["derive"] }
