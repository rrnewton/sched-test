[package]
name = "scxsim-workload-ir"
version = "0.1.0"
edition = "2021"
# One floor for the whole publish set, measured end to end; see the note in
# crates/scx_layered_alloc/Cargo.toml. Nothing re-checks it yet: sim-ojycs.
rust-version = "1.88"
publish = false
description = "Restricted workload IR shared between ktstr and scx-sim, plus the lowering from ktstr's declarative op vocabulary onto it"
license = "BSD-3-Clause"
repository = "https://github.com/rrnewton/sched-test"
keywords = ["sched_ext", "scheduler", "simulator", "ktstr"]
categories = ["simulation", "development-tools::testing"]
include = ["/build.rs", "/src/**", "/tests/**", "/LICENSE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Optional: only the IR -> Scenario ingestion needs the simulator itself. Kept
# behind a feature so a consumer that only wants the IR + lowering (ktstr's
# DSL PR, which must stay scx-sim-free) does not pull in the BPF build.
scx_simulator = { version = "1.0.0", path = "../scx_simulator", optional = true, default-features = false }
# The provenance check walks the SERIALISED source scenario, which is what lets
# it cover a new work-type field without anyone editing it. That makes
# serde_json a real dependency of the crate, not just of its tests.
serde_json = "1"

[features]
default = []
ingest = ["dep:scx_simulator", "dep:scxsim-build"]

[build-dependencies]
# Only for emit_host_link_args(), which this package's own `ingest` binaries
# need because link arguments are not transitive. See build.rs. Optional, so a
# consumer of the IR and lowering alone has no scx-sim crate anywhere in its
# graph, build dependencies included.
scxsim-build = { version = "0.1.0", path = "../scxsim-build", optional = true }

[dev-dependencies]
serde_json = "1"
# Default features ON here (unlike the optional dep above) so integration
# tests can use the standalone DynamicScheduler constructors to actually RUN a
# lowered scenario, not merely build one.
scx_simulator = { version = "1.0.0", path = "../scx_simulator" }

# Loads a real scheduler .so and RUNS a lowered scenario, so it needs the
# ingestion half. required-features (rather than a cfg in the file) means cargo
# skips the target entirely in a default build instead of compiling it empty.
[[test]]
name = "sched_basic_proportional"
required-features = ["ingest"]
