[package]
name = "scxsim-workload-ir"
version = "0.1.0"
edition = "2021"
publish = false
description = "Restricted workload IR shared between ktstr and scx-sim, plus the lowering from ktstr's declarative op vocabulary onto it"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Optional: only the IR -> Scenario ingestion needs the simulator itself. Kept
# behind a feature so a consumer that only wants the IR + lowering (ktstr's
# DSL PR, which must stay scx-sim-free) does not pull in the BPF build.
scx_simulator = { path = "../scx_simulator", optional = true, default-features = false }

[features]
default = []
ingest = ["dep:scx_simulator"]

[dev-dependencies]
serde_json = "1"
scx_simulator = { path = "../scx_simulator", default-features = false }
