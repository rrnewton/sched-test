[package]
name = "embed_harness"
version = "0.1.0"
edition = "2021"
publish = false
description = "In-repo proof that a downstream binary embedding scx_simulator resolves the dlopen kfunc-export link contract by re-emitting scxsim_build::EXPORTED_SYMS from its own build script."

# scx_simulator is a NORMAL dependency (not a dev-dependency) for the build
# script's sake: cargo hands a `links` crate's metadata -- here scx_simulator's
# DEP_SCXSIM_* build inputs, including libbpf's header dir -- only to the build
# scripts of packages that list it under [dependencies]. A real embedder declares
# it the same way. It also puts scx_simulator's C static libs, which DEFINE the
# exported symbols, into the test binary.
#
# default-features = false: an embedder does not want the `standalone` convenience
# constructors (they bake in scx_simulator's compile-time SCHEDULER_SO_DIR). The
# test loads via load_with_definition, so it never needs them. (Under a
# `--workspace` build, feature unification still turns `standalone` on for the
# shared scx_simulator because scx_simulator's own tests request it; an isolated
# `cargo test -p embed_harness` is what links the standalone-free build.)
[dependencies]
scx_simulator = { path = "../scx_simulator", default-features = false }

# build.rs uses scxsim-build for emit_host_link_args + SimBuildInputs.
[build-dependencies]
scxsim-build = { path = "../scxsim-build" }

# The test constructs a SchedulerDefinition from scratch.
[dev-dependencies]
scxsim-build = { path = "../scxsim-build" }
