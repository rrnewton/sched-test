[package]
name = "scx_layered_alloc"
version = "0.1.0"
# 2024, NOT 2021, and this is why the crate exists at all. src/lib.rs compiles
# upstream scx/scheds/rust/scx_layered/src/alloc.rs verbatim, and an included
# file is parsed under the INCLUDING crate's edition. Upstream scx_layered is
# edition 2024 and alloc.rs uses let chains, which do not parse under 2021 —
# "let chains are only allowed in Rust 2024 or later". The edition of a crate
# that inlines upstream source must track that source; it is not a free choice.
# Isolating the one file here lets it follow upstream while scx_simulator stays
# on 2021.
edition = "2024"
# Measured, not guessed: 1.87.0 fails on the let chains in the upstream file this
# crate compiles (stable from 1.88); 1.88.0 builds the whole publish set and
# reproduces the 1.97.1 run fingerprints. Nothing re-checks it yet: sim-ojycs.
rust-version = "1.88"
publish = false
description = "scx_layered's alloc.rs CPU allocator, compiled verbatim for scx_simulator"
# BSD-3-Clause: this crate's own code (src/). GPL-2.0-only: the upstream
# scx_layered alloc.rs it compiles (vendor/scx), and the vendored
# largest_remainder in src/lib.rs. Both licence texts ship in the package.
license = "BSD-3-Clause AND GPL-2.0-only"
repository = "https://github.com/rrnewton/sched-test"
keywords = ["sched_ext", "scheduler", "simulator"]
categories = ["simulation"]
# `vendor/scx` is a symlink tree into the scx submodule in a checkout; cargo
# packages the target file itself.
include = [
    "/build.rs",
    "/src/**",
    "/vendor/scx/scheds/rust/scx_layered/src/alloc.rs",
    "/vendor/scx/LICENSE",
    "/LICENSE",
]

[build-dependencies]
scxsim-build = { version = "0.1.0", path = "../scxsim-build" }
