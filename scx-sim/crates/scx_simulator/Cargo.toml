[package]
name = "scx_simulator"
version = "1.0.0"
# 2024, NOT 2021, because src/safe/mod.rs #[path]-includes upstream
# scx/scheds/rust/scx_layered/src/alloc.rs, and upstream scx_layered is itself
# edition 2024 (rust-version 1.91). Upstream started using let chains, which
# only parse under 2024 — on 2021 this crate fails at `cargo fmt` with
# "let chains are only allowed in Rust 2024 or later" before it even compiles.
# The edition of a crate that inlines upstream source must track the edition of
# that source; it is not a free choice.
edition = "2024"
publish = false

[features]
# `standalone` (default-on) gates the convenience constructors
# (DynamicScheduler::simple/tickless/cosmos/mitosis/lavd/...) that resolve
# scheduler `.so` paths from the compile-time `SCHEDULER_SO_DIR` env var. An
# embedder builds with `default-features = false` and loads schedulers via
# `load_with_definition` / `try_load_with_definition` (explicit path + a
# SchedulerDefinition it supplies), so it never references `SCHEDULER_SO_DIR`.
default = ["standalone"]
standalone = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
libbpf-sys = "=1.6.1"
libc = "0.2"
libloading = "0.8"
perf-event-open-sys = "5"
perfetto_protos = "0.51"
protobuf = "3"
rand = { version = "0.8", features = ["small_rng"] }
scx_perf = { path = "../scx_perf" }
scx_layered_growth = { path = "../scx_layered_growth" }
scxsim-build = { path = "../scxsim-build" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.6", features = ["html_reports"] }

[build-dependencies]
cc = "1.2.29"
scxsim-build = { path = "../scxsim-build" }

[[bench]]
name = "simulator"
harness = false
