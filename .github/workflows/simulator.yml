name: scx_simulator

on:
  push:
    branches:
      - '**'
    paths:
      - 'scx-sim/**'
      - 'lib/scxtest/**'
      - 'scheds/**'
      - '.github/workflows/simulator.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'scx-sim/**'
      - 'lib/scxtest/**'
      - 'scheds/**'
      - '.github/workflows/simulator.yml'

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free up disk space on runner
        # The ubuntu-latest runner ships with ~15-20 GiB of pre-installed
        # tooling (Android SDK, .NET, Haskell, etc.) that this workflow
        # doesn't use. Cargo's incremental build + the e9patch cache
        # routinely push the runner past its disk ceiling during link
        # ("No space left on device" — observed 2026-05-19 on
        # simulator.v6 / agent/cgroup-bw-real-phase2-rootcause). Clearing
        # the unused tooling buys ~10 GiB of headroom.
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev \
            build-essential xxd markdown zlib1g-dev

      - name: Install cargo-nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            scx-sim/target/
          key: ${{ runner.os }}-simulator-${{ hashFiles('scx-sim/Cargo.lock') }}

      - uses: actions/cache@v4
        with:
          path: scx-sim/third_party/e9patch/
          key: ${{ runner.os }}-e9patch-v1

      - name: Install e9patch
        working-directory: scx-sim
        run: make install-e9patch

      - name: Validate scx_simulator
        if: hashFiles('scx-sim/validate.sh') != ''
        working-directory: scx-sim
        run: bash validate.sh

      - name: Build scx_simulator (no validate.sh yet)
        if: hashFiles('scx-sim/validate.sh') == ''
        working-directory: scx-sim
        run: cargo build --workspace
