# Nightly scx submodule pin bump — MECHANICAL, and deliberately agent-free.
#
# WHY THIS FILE IS STILL CALLED sync-upstream.yml
# ------------------------------------------------
# The name is wrong for what it now does, and it is kept anyway, on purpose.
# `gh workflow run <file> --ref integration` resolves the workflow BY FILENAME
# ON THE DEFAULT BRANCH (main) and then executes the version at `--ref`. This
# filename is already on main, already in the carrier matrix in
# `.github/workflows/scheduled-dispatch.yml`, and has 41 dispatched runs proving
# it is reachable. Renaming it would mean landing a rename on `main` — a branch
# that by local policy takes only explicit consolidation PRs, and which the sync
# job's own comments describe as blocked on fbsource import problems — and would
# re-open the registration problem that took three commits to close last time
# (d41f6406, a46ceb99, 1b2c6aab). A misleading filename is a much cheaper
# problem than an unreachable workflow. The `name:` below says what it does.
#
# WHAT CHANGED, AND WHY THE AGENT IS GONE FROM THE COMMON PATH
# -------------------------------------------------------------
# This job used to do the mechanical bump and then hand off to
# `anthropics/claude-code-action@v1` to fix whatever the bump broke. Measured
# outcome of that design, over its entire life (2026-08-13..2026-09-16):
#
#     41 runs. 38 failure, 3 skipped, ZERO successes.
#
# Every single failure was the same one, and it was never a scx problem:
#
#     App token exchange failed: 401 Unauthorized -
#     Claude Code is not installed on this repository.
#
# claude-code-action requires the Claude Code GitHub App to be INSTALLED on the
# repo. `ANTHROPIC_API_KEY` being present does not satisfy that — the key guard
# passed on all 41 runs. Installing a third-party App on an org-managed repo is
# not something this workflow can do for itself.
#
# The important part is WHICH steps were passing: everything before the agent,
# including the submodule rebase. The mechanical core worked every night for
# five weeks and its result was thrown away every night, because an optional
# repair step it did not need was wired as a hard dependency in front of the
# only steps that deliver anything.
#
# So the agent is now the EXCEPTION path, not the default:
#
#     bump -> build -> validate -> GREEN? land it.  RED? preserve + escalate.
#
# The common path costs zero tokens and has no model, no API key, and no App
# dependency. Nothing in the green path can be broken by an agent being
# unavailable, because the green path never calls one.
#
# LANDING A PIN BUMP WITHOUT A HUMAN — the standing rule, and its carve-out
# --------------------------------------------------------------------------
# Both CLAUDE.md files say to pause for the owner before changing the scx pin.
# This job deliberately does not, for the tests-green path only, on the owner's
# explicit instruction (task `nightly-scx-pin-bump-automation`, 2026-09-16:
# "IF TESTS PASS -> LAND THE PIN BUMP automatically"). The carve-out is recorded
# in CLAUDE.md next to the original rule. If you are here to add a human gate
# back onto the green path, read that first — the eight-week, 395-commit drift
# this job exists to stop was itself produced by a pin bump that never landed.
# A RED bump still stops and escalates; that half of the rule is untouched.
name: scx pin bump (mechanical)

on:
  # How this actually fires: the carrier on `main` dispatches it nightly.
  workflow_dispatch:
    inputs:
      target:
        description: 'Bump to this exact scx commit instead of upstream tip (staged-walk knob; blank = upstream main)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Bump, build and validate, but never land'
        required: false
        default: false
        type: boolean
  push:
    branches: ['integration']
    paths:
      - '.github/workflows/sync-upstream.yml'
      - 'scripts/scx_pin_bump.sh'
    # A push here is a DRY RUN, not a registration no-op. The previous shape
    # skipped the job entirely on push, which meant the bump logic could only
    # ever be exercised by waiting for 04:10 UTC. Editing the bump script now
    # proves it against the real 395-commit-scale rebase without landing
    # anything — and still keeps the workflow registered for the carrier.

permissions:
  contents: read

env:
  # Every write is gated on this. The mirror (rrnewton/sched-test) receives the
  # same workflow files by design, and must never open PRs or land commits.
  CANONICAL_REPO: facebookexperimental/sched-test

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # push the bump branch
      pull-requests: write   # open and merge the PR
      issues: write          # the escalation path files an issue
    steps:
      - name: Refuse to run anywhere but the canonical repo
        run: |
          if [ "${{ github.repository }}" != "$CANONICAL_REPO" ]; then
            echo "::notice::This job only lands on $CANONICAL_REPO; ${{ github.repository }} is a mirror. Exiting without action."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: integration
          submodules: recursive
          # The bump computes a merge-base against upstream. A shallow clone
          # cannot do that, and fails in a way that looks like a bad pin.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this run may land
        id: mode
        run: |
          # Push events are always dry runs; dispatch honours its input.
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "may_land=false" >> $GITHUB_OUTPUT
            echo "::notice::DRY RUN — will bump, build and validate, but not land."
          else
            echo "may_land=true" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------------------------------------------
      # TIER 1: the mechanical bump. No model, no tokens.
      # ---------------------------------------------------------------------
      - name: Bump the scx pin, replaying local patches
        id: bump
        run: |
          set +e
          ARGS="--fetch"
          if [ -n "${{ inputs.target }}" ]; then ARGS="$ARGS --target ${{ inputs.target }}"; fi
          scripts/scx_pin_bump.sh $ARGS
          rc=$?
          echo "rc=$rc" >> $GITHUB_OUTPUT
          # 10 means "already current" and is a success, not a failure.
          case "$rc" in
            0)  echo "::notice::pin bumped; continuing to build + validate." ;;
            10) echo "::notice::pin already current; nothing to do." ;;
            *)  echo "::error::pin bump REFUSED (exit $rc). The pin was not changed and nothing was discarded." ;;
          esac
          exit 0

      - name: Stop cleanly if there was nothing to bump
        if: steps.bump.outputs.rc == '10'
        run: echo "Pin is already at upstream. Done."

      # A refusal (conflict / would-lose-a-patch) is the one case where the
      # mechanical path cannot proceed and a human or agent is genuinely needed.
      # It is escalated by the final step; fail the job here so the run is red.
      - name: Record a refusal
        if: steps.bump.outputs.rc != '0' && steps.bump.outputs.rc != '10'
        run: |
          {
            echo "stage=bump"
            echo "detail=scx_pin_bump.sh refused with exit ${{ steps.bump.outputs.rc }} — rebase conflict, or a carried local patch would have been lost. The pin was NOT changed."
          } >> $GITHUB_ENV
          echo "FAILED=1" >> $GITHUB_ENV

      # ---------------------------------------------------------------------
      # Build + validate the bumped pin. Same setup as simulator.yml, which is
      # the workflow that already runs validate.sh successfully — copied rather
      # than reinvented so the two cannot drift into testing different things.
      # ---------------------------------------------------------------------
      - name: Free runner disk space
        if: steps.bump.outputs.rc == '0'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost \
                      /usr/share/swift /opt/hostedtoolcache/CodeQL \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean || true
          df -h /

      - name: Install system dependencies
        if: steps.bump.outputs.rc == '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libelf-dev \
            build-essential xxd markdown zlib1g-dev

      # No toolchain action: rust-toolchain.toml pins 1.97.1 and every other
      # workflow lets rustup resolve it. Printing it proves the pin took effect
      # rather than leaving it assumed. Do NOT add anything that exports
      # RUSTUP_TOOLCHAIN or runs `rustup override set` — either would take this
      # job off the pin while the rest of CI stayed on it.
      - name: Show the pinned Rust toolchain
        if: steps.bump.outputs.rc == '0'
        run: |
          rustup show active-toolchain
          cargo --version && cargo clippy --version

      - name: Install cargo-nextest
        if: steps.bump.outputs.rc == '0'
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Install cargo-llvm-cov
        if: steps.bump.outputs.rc == '0'
        run: curl -LsSf https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Cache Cargo artifacts
        if: steps.bump.outputs.rc == '0'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            scx-sim/target/
          key: ${{ runner.os }}-scx-pin-bump-${{ hashFiles('scx-sim/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-scx-pin-bump-

      - name: Install scx-sim dependencies
        if: steps.bump.outputs.rc == '0'
        run: cd scx-sim && make install-deps

      # THE GATE. The whole script, not a subset: validate.sh is maintained as
      # equivalent to CI, and that equivalence is the only thing licensing this
      # job to land without waiting for a separate CI round. Running a subset
      # would void exactly the guarantee being relied on.
      - name: Validate
        if: steps.bump.outputs.rc == '0'
        id: validate
        run: |
          set +e
          cd scx-sim && bash validate.sh 2>&1 | tee /tmp/validate.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> $GITHUB_OUTPUT
          if [ "$rc" -ne 0 ]; then
            {
              echo "stage=validate"
              echo "FAILED=1"
            } >> $GITHUB_ENV
            # Last 60 lines is where validate.sh puts the actual failure.
            {
              echo 'detail<<VEOF'
              tail -60 /tmp/validate.log
              echo 'VEOF'
            } >> $GITHUB_ENV
          fi
          exit 0

      # ---------------------------------------------------------------------
      # GREEN: land it. This is the whole point of the job.
      # ---------------------------------------------------------------------
      # PIN_BUMP_TOKEN, NOT GITHUB_TOKEN — and the difference is load-bearing.
      #
      # The "Meta CLA Enforcement" ruleset covers `~ALL` refs with a
      # required_status_checks rule, and its bypass list is RepositoryRole 2/4/5
      # plus two named Integrations. `github-actions[bot]` is in none of them, so
      # a GITHUB_TOKEN push of ANY branch is rejected:
      #
      #     remote: error: GH013: Repository rule violations found
      #     remote: - Required status check "Meta CLA Check" is expected.
      #
      # Discovered by running this job for real (run 35136021677), not by
      # reading it. A brand-new branch has no checks yet, so it can never
      # satisfy the rule, and no amount of retrying helps.
      #
      # The fix is a token belonging to a principal that DOES bypass: any user
      # with the Write role (RepositoryRole:2). Add a fine-grained PAT with
      # contents:write + pull_requests:write as the repo secret PIN_BUMP_TOKEN.
      # Until that exists this step cannot land, and says so loudly through the
      # normal escalation path rather than dying with a confusing git error.
      - name: Land the bump
        if: steps.bump.outputs.rc == '0' && steps.validate.outputs.rc == '0' && steps.mode.outputs.may_land == 'true'
        id: land
        env:
          GH_TOKEN: ${{ secrets.PIN_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          PIN_BUMP_TOKEN: ${{ secrets.PIN_BUMP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PIN_BUMP_TOKEN:-}" ]; then
            echo "::error::Cannot land: repo secret PIN_BUMP_TOKEN is not set, and GITHUB_TOKEN cannot push here (the Meta CLA Enforcement ruleset covers ~ALL refs and does not bypass github-actions[bot]). THE BUMP ITSELF SUCCEEDED AND VALIDATE PASSED — only the landing is blocked."
            {
              echo "stage=land (blocked: no PIN_BUMP_TOKEN)"
              echo "FAILED=1"
              echo 'detail<<VEOF'
              echo "The bump is GREEN. validate.sh passed on the bumped pin."
              echo ""
              echo "It could not be landed because this repository has no PIN_BUMP_TOKEN"
              echo "secret, and the default GITHUB_TOKEN is refused by the"
              echo "'Meta CLA Enforcement' ruleset, which applies required status checks"
              echo "to ~ALL refs and bypasses only RepositoryRole 2/4/5 and two named"
              echo "Integrations -- github-actions[bot] is not among them."
              echo ""
              echo "To enable automatic landing, add a fine-grained PAT owned by a user"
              echo "with the Write role, scoped to this repository with"
              echo "contents:write + pull_requests:write, as the secret PIN_BUMP_TOKEN."
              echo ""
              echo "Until then a human can land this bump in one command:"
              echo "    scripts/scx_pin_bump.sh --fetch && cd scx-sim && bash validate.sh"
              echo 'VEOF'
            } >> $GITHUB_ENV
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${PIN_BUMP_TOKEN}@github.com/${{ github.repository }}.git"

          BRANCH="scx-pin-bump-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "scx: bump pin to upstream ${{ steps.bump.outputs.new_pin_short }}

          Mechanical nightly bump — no agent, no model.

          Previous pin: ${{ steps.bump.outputs.old_pin }}
          New pin:      ${{ steps.bump.outputs.bumped_pin }}
          Upstream tip: ${{ steps.bump.outputs.new_pin }}
          Absorbed:     ${{ steps.bump.outputs.upstream_commits }} upstream commit(s)
          Replayed:     ${{ steps.bump.outputs.carried_count }} carried local commit(s), verified by subject and count

          Landed automatically because the full validate.sh gate passed.
          See .github/workflows/sync-upstream.yml for why this does not wait
          for a human."

          git push origin "$BRANCH"
          gh pr create \
            --base integration --head "$BRANCH" \
            --title "scx: bump pin to upstream ${{ steps.bump.outputs.new_pin_short }} (${{ steps.bump.outputs.upstream_commits }} commits)" \
            --body "Mechanical nightly scx pin bump. Zero-token path: no agent ran.

          | | |
          |---|---|
          | previous pin | \`${{ steps.bump.outputs.old_pin_short }}\` |
          | new pin | \`${{ steps.bump.outputs.bumped_pin_short }}\` |
          | upstream tip | \`${{ steps.bump.outputs.new_pin_short }}\` |
          | upstream commits absorbed | ${{ steps.bump.outputs.upstream_commits }} |
          | local patches replayed | ${{ steps.bump.outputs.carried_count }} |

          Carried local commits were rebased onto the new upstream and verified
          **by subject and by count**; the job refuses to bump rather than drop
          one. The full \`validate.sh\` gate passed before this PR was opened."

          # Squash: the bump is one logical change, and sched-test squash-merges.
          gh pr merge --squash --delete-branch --admin "$BRANCH"
          echo "::notice::Landed scx pin bump ${{ steps.bump.outputs.bumped_pin_short }} on integration."
          echo "landed=true" >> $GITHUB_OUTPUT

      # `git push` reaches origin only. The mirror is a separate remote with no
      # credentials in this repo's secrets (the only secret here is
      # ANTHROPIC_API_KEY), so this job CANNOT push it and must not pretend to.
      # Say so loudly instead of leaving the drift silent — a report that cites
      # a mirror URL 404s for external readers until someone runs this.
      - name: Warn that the mirror is now behind
        if: steps.land.outputs.landed == 'true'
        run: |
          {
            echo "### Mirror sync still required"
            echo ""
            echo "This job landed on \`origin/integration\`. It has no credentials for"
            echo "\`mirror\` (rrnewton/sched-test), so the mirror is now behind by this"
            echo "commit. Run:"
            echo ""
            echo '```bash'
            echo "with-proxy git fetch origin integration"
            echo "with-proxy git push mirror FETCH_HEAD:refs/heads/integration"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          echo "::warning::Landed on origin only — mirror/integration is now behind. See the run summary for the sync command."

      # ---------------------------------------------------------------------
      # TIER 2: RED. Preserve the work, then escalate so an agent can pick it up.
      #
      # Escalation is a GitHub ISSUE, not an inline agent call, because the
      # inline agent call is exactly what was broken for five weeks and cannot
      # be fixed from inside this file (it needs a GitHub App installed on the
      # repo). An issue is durable, is visible where people already look, and
      # survives the agent runner being unavailable. `scripts/wake_pin_bump_agent.sh`
      # turns an open issue into a woken agent on a machine that has one.
      # ---------------------------------------------------------------------
      # Preserve as an ARTIFACT FIRST, because an artifact needs no push rights
      # and therefore cannot be blocked by the CLA ruleset. The branch push is
      # attempted afterwards, best-effort, and its failure must not take the
      # escalation down with it — which is exactly what happened on run
      # 35136021677: the push was rejected, the step failed, and every later
      # step (including "Escalate to an agent") was skipped by the implicit
      # success() guard. The bump failed and NOBODY WAS TOLD. A tier-2 path that
      # only fires when tier 1 fails in the expected way is not a tier-2 path.
      - name: Preserve the failed bump
        if: always() && env.FAILED == '1' && steps.bump.outputs.rc == '0'
        env:
          PIN_BUMP_TOKEN: ${{ secrets.PIN_BUMP_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="scx-pin-bump-failed-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -q -m "WIP: scx pin bump to ${{ steps.bump.outputs.new_pin_short }} — ${{ env.stage }} FAILED

          Absorbed ${{ steps.bump.outputs.upstream_commits }} upstream commits and
          replayed ${{ steps.bump.outputs.carried_count }} local patch(es) intact;
          the failure is downstream of the bump itself."

          # The patch is the durable artifact. It carries the gitlink change too,
          # so `git am` reproduces the bump exactly without re-running it.
          git format-patch -1 --stdout > /tmp/scx-pin-bump.patch
          echo "PATCH_READY=1" >> $GITHUB_ENV

          if [ -n "${PIN_BUMP_TOKEN:-}" ]; then
            git remote set-url origin \
              "https://x-access-token:${PIN_BUMP_TOKEN}@github.com/${{ github.repository }}.git"
            if git push origin "$BRANCH"; then
              echo "FAIL_BRANCH=$BRANCH" >> $GITHUB_ENV
            else
              echo "::warning::could not push $BRANCH; the patch artifact is the copy of record."
            fi
          else
            echo "::warning::no PIN_BUMP_TOKEN, so the failed bump is preserved as a workflow ARTIFACT only (github-actions[bot] cannot push branches here — see the Land step)."
          fi
          exit 0

      - name: Upload the failed bump as an artifact
        if: always() && env.PATCH_READY == '1'
        uses: actions/upload-artifact@v4
        with:
          name: scx-pin-bump-${{ steps.bump.outputs.new_pin_short }}
          path: /tmp/scx-pin-bump.patch
          retention-days: 30

      # always(), NOT the implicit success(). This step is the ONLY thing that
      # tells anyone the bump failed, so it must survive any earlier step
      # failing — including the preservation step it follows. Filing an issue
      # needs only issues:write, which GITHUB_TOKEN has and no ruleset blocks.
      - name: Escalate to an agent
        if: always() && env.FAILED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="scx pin bump failed at ${{ env.stage }} — upstream ${{ steps.bump.outputs.new_pin_short }}"

          BODY=$(cat <<EOF
          The mechanical scx pin bump failed. **No agent has looked at this yet** —
          that is what this issue is for.

          | | |
          |---|---|
          | failed at | \`${{ env.stage }}\` |
          | current pin | \`${{ steps.bump.outputs.old_pin_short }}\` |
          | target upstream | \`${{ steps.bump.outputs.new_pin_short }}\` |
          | upstream commits | ${{ steps.bump.outputs.upstream_commits }} |
          | local patches carried | ${{ steps.bump.outputs.carried_count }} |
          | work preserved on | ${{ env.FAIL_BRANCH && format('branch `{0}`', env.FAIL_BRANCH) || (env.PATCH_READY == '1' && 'the `scx-pin-bump-*` workflow **artifact** on the run below (30-day retention) — no branch, because github-actions[bot] cannot push here' || 'nothing to preserve — the bump itself refused') }} |
          | run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |

          **The pin on \`integration\` is unchanged.** Nothing was landed and no
          local patch was discarded — the bump script verifies carried commits by
          subject and count and refuses rather than dropping one.

          ### Failure detail

          \`\`\`
          ${{ env.detail }}
          \`\`\`

          ### Reproduce locally

          \`\`\`bash
          # in your own worktree, never in the primary checkout
          git checkout -b fix/scx-pin-bump integration
          git submodule update --init --recursive scx
          scripts/scx_pin_bump.sh --fetch
          cd scx-sim && make install-deps && bash validate.sh
          \`\`\`

          If the bump itself refused, narrow it with the staged-walk knob rather
          than fighting the whole range at once:

          \`\`\`bash
          scripts/scx_pin_bump.sh --fetch --target <intermediate-upstream-sha>
          \`\`\`

          Close this issue when the bump has LANDED, not when a fix is written.
          EOF
          )

          # One issue per failing upstream target, not one per night. Five weeks
          # of nightly failures previously produced five weeks of identical
          # noise; a re-opened comment thread on one issue is readable, 35
          # issues are not.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
                       --state open --label scx-pin-bump --json number,title \
                       --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Still failing as of $(date -u +%Y-%m-%dT%H:%MZ) — run ${{ github.run_id }}."
            echo "::warning::scx pin bump still failing; commented on existing issue #$EXISTING"
          else
            # The label may not exist yet on a fresh repo; create it idempotently.
            gh label create scx-pin-bump --repo "${{ github.repository }}" \
              --description "Automated scx submodule pin bump needs an agent" \
              --color B60205 2>/dev/null || true
            NUM=$(gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --label scx-pin-bump --body "$BODY" \
              | grep -oE '[0-9]+$')
            echo "::warning::scx pin bump failed; opened issue #$NUM for an agent to pick up"
          fi

      - name: Fail the run if the bump did not succeed
        if: always() && env.FAILED == '1'
        run: |
          echo "::error::scx pin bump failed at ${{ env.stage }}. An escalation issue is open; the pin on integration is unchanged."
          exit 1
